# Confere todo dia se o Meu Caixa está no ar: página inicial, app, banco e as duas funções (whatsapp e ai).
# Se algo falhar, o GitHub manda e-mail ("Run failed: Monitor Meu Caixa") e o log diz o que caiu.
# A consulta da função whatsapp usa o banco (como um acesso do app), então o projeto grátis do Supabase não fica
# 7 dias parado e não é pausado por falta de uso. Só endereços públicos: nenhum segredo aqui.
# Rodar na hora: Actions → Monitor Meu Caixa → Run workflow (ou gh workflow run monitor.yml).
# Atenção: o GitHub desliga agendamentos de repositório público depois de 60 dias sem commit (avisa por e-mail antes).
name: Monitor Meu Caixa

on:
  schedule:
    - cron: '17 11 * * *' # todo dia, 08:17 de Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  saude:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Site, app, banco e funções
        env:
          SITE: https://iptvquantic.github.io/meu-caixa
          FN: https://jgqhtshcuyzytljkmmxd.supabase.co/functions/v1
        run: |
          set -euo pipefail
          # projeto acordando (ou pausado e reativado) pode demorar: tenta de novo por ~2 minutos antes de acusar
          get() { curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 30 "$1" || { echo "❌ não respondeu: $1" >&2; return 1; }; }
          check() { if grep -q -- "$2" <<<"$1"; then echo "✅ $3"; else echo "❌ $3: $(head -c 300 <<<"$1")"; exit 1; fi; }
          home=$(get "$SITE/");               check "$home" 'Meu Caixa' 'página inicial'
          app=$(get "$SITE/app.html");        check "$app" 'MC_CONFIG' 'app'
          sw=$(get "$SITE/sw.js");            check "$sw" "mc-[0-9]" "versão no ar: $(grep -o -m1 "mc-[0-9][0-9.]*" <<<"$sw")"
          wa=$(get "$FN/whatsapp?health=1");  check "$wa" '"db":true' "banco e função whatsapp ($wa)"
          ai=$(get "$FN/ai?health=1");        check "$ai" '"ok":true' "função ai ($ai)"
