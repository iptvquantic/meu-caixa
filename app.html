<!doctype html>
<html lang="pt-BR" data-mc-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1215">
<meta name="description" content="Meu Caixa: entradas, saídas, cartão e investimentos para autônomos e pequenos negócios. No celular e no PC.">
<title>Meu Caixa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Caixa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e9b949'/%3E%3Cpath d='M18 22h28a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V26a4 4 0 0 1 4-4zm0 0 22-8v8' fill='none' stroke='%231b1405' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='41' cy='35' r='3' fill='%231b1405'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" media="print" data-font>
<style>
/* ===== Tokens ===== */
:root{
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-num:var(--font);
  --bg:#0c1215;--surface:#131b1f;--surface-2:#1a2429;--surface-3:#222e34;
  --border:#24323a;--border-strong:#33444d;
  --text:#e9f0f2;--text-2:#b9c7cd;--muted:#8a9ba3;
  --accent:#e9b949;--accent-ink:#f0c766;--on-accent:#1b1405;
  --in:#34d399;--out:#f87171;--card:#a78bfa;--invest:#60a5fa;--warn:#fbbf24;
  --shadow:0 12px 32px rgba(0,0,0,.38);--glow:none;
  --r-lg:18px;--r-md:12px;--r-sm:9px;
  --nav-h:64px;--top-h:56px;--side-w:248px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-mc-theme="dark"]{color-scheme:dark}
:root[data-mc-theme="light"]{
  --bg:#eef2f1;--surface:#ffffff;--surface-2:#f5f8f7;--surface-3:#e9efed;
  --border:#dce4e1;--border-strong:#c5d1cd;
  --text:#0f1e1a;--text-2:#34463f;--muted:#5e6f69;
  --accent:#d9a52c;--accent-ink:#8a5e00;--on-accent:#1b1405;
  --in:#059669;--out:#dc2626;--card:#7c3aed;--invest:#2563eb;--warn:#b45309;
  --shadow:0 10px 28px rgba(15,30,26,.10);
  color-scheme:light;
}
:root[data-mc-theme="cyber"]{
  --font-num:'Chakra Petch',var(--font);
  --bg:#07050e;--surface:#100b1f;--surface-2:#171030;--surface-3:#20163f;
  --border:#2c1f55;--border-strong:#46318a;
  --text:#f0ecff;--text-2:#cbc1f5;--muted:#9c90cc;
  --accent:#ff2e97;--accent-ink:#ff6bb8;--on-accent:#12000a;
  --in:#3bffa0;--out:#ff4d7a;--card:#c38bff;--invest:#33d6ff;--warn:#ffd23f;
  --shadow:0 0 0 1px rgba(255,46,151,.14),0 14px 38px rgba(0,0,0,.6);
  --glow:0 0 18px rgba(255,46,151,.35);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;height:100%}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100%;background:var(--bg);color:var(--text);font:500 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
:root[data-mc-theme="cyber"] body{
  background:
    linear-gradient(rgba(255,46,151,.045) 1px,transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg,rgba(51,214,255,.04) 1px,transparent 1px) 0 0/32px 100%,
    radial-gradient(1200px 600px at 80% -10%,rgba(255,46,151,.12),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,rgba(51,214,255,.10),transparent 60%),
    var(--bg);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent-ink)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.c-in{color:var(--in)}.c-out{color:var(--out)}.c-card{color:var(--card)}.c-invest{color:var(--invest)}.c-muted{color:var(--muted)}

/* ===== Boot / auth ===== */
.boot{min-height:80vh;display:grid;place-items:center;color:var(--muted);font-weight:700}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px 22px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.brand-mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);box-shadow:var(--glow)}
.brand-mark svg.i{width:20px;height:20px;stroke-width:2.2}
.auth h1{font-size:24px;line-height:1.2;margin:22px 0 6px;font-weight:800}
.auth p.lead{color:var(--text-2);margin-bottom:18px}
.auth-tabs{display:flex;gap:6px;margin-bottom:14px}
.auth-tabs button{flex:1;padding:9px;border-radius:10px;font-weight:700;color:var(--muted);border:1px solid transparent}
.auth-tabs button[aria-selected="true"]{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.msg{padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;font-weight:600}
.msg.err{background:color-mix(in srgb,var(--out) 14%,transparent);color:var(--out)}
.msg.ok{background:color-mix(in srgb,var(--in) 14%,transparent);color:var(--in)}

/* ===== Campos ===== */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>span{font-size:12.5px;font-weight:700;color:var(--text-2)}
.input,.select,textarea.input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 12px;outline:none;transition:border-color .15s}
.input:focus,.select:focus{border-color:var(--accent)}
.input::placeholder{color:var(--muted)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:var(--r-md);font-weight:800;background:var(--surface-2);border:1px solid var(--border);color:var(--text);white-space:nowrap}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--out)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.link{color:var(--accent-ink);font-weight:700;padding:6px 2px}
.iconbtn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:12px;color:var(--text-2);border:1px solid transparent}
.iconbtn:hover{background:var(--surface-2);border-color:var(--border)}

/* ===== Layout do app ===== */
.app{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;border-right:1px solid var(--border);background:var(--surface)}
.side .brand{padding:4px 8px 18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--text-2);font-weight:700;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:10px 6px 0;border-top:1px solid var(--border)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-weight:800;flex:none}
.who-txt{min-width:0}.who-txt b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2)}
.badge.gold{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent-ink)}
.main{min-width:0;padding:0 28px 48px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;min-height:72px;padding:14px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.top h1{font-size:22px;font-weight:800;margin-right:auto}
.month{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px}
.month b{min-width:130px;text-align:center;font-size:14px;font-weight:800}
.month .iconbtn{width:34px;height:34px;border-radius:50%}
.page{max-width:1180px}
.mtop,.mnav{display:none}

/* ===== Blocos ===== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.panel h2{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h2 .link{margin-left:auto;font-size:13px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px}
.stat small{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.stat small svg.i{width:16px;height:16px}
.stat b{display:block;font-size:20px;font-weight:800;margin-top:6px}

/* Cupom (o saldo) */
.receipt{position:relative;background:var(--surface-2);border:1px solid var(--border);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 22px 30px;
  -webkit-mask:radial-gradient(9px at 50% 100%,#0000 98%,#000) 50% 100%/18px 100% repeat-x;mask:radial-gradient(9px at 50% 100%,#0000 98%,#000) 50% 100%/18px 100% repeat-x}
.receipt .r-head{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px;font-weight:700}
.receipt .r-val{font-size:clamp(34px,7vw,52px);font-weight:800;line-height:1.05;margin:10px 0 6px}
.receipt .r-sub{color:var(--text-2);font-weight:600;font-size:13.5px}
.receipt .r-cut{border-top:1.5px dashed var(--border-strong);margin:16px 0 12px}
.receipt .r-lines{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:14px}
.receipt .r-lines span{color:var(--text-2)}
.receipt .r-lines b{text-align:right}
:root[data-mc-theme="cyber"] .receipt{box-shadow:inset 0 0 0 1px rgba(255,46,151,.18)}
:root[data-mc-theme="cyber"] .receipt .r-val{text-shadow:0 0 22px currentColor}

/* Listas */
.list{display:flex;flex-direction:column}
.day{font-size:12.5px;font-weight:800;color:var(--muted);padding:14px 4px 6px;display:flex;justify-content:space-between}
.tx{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:12px;width:100%;text-align:left}
.tx:hover{background:var(--surface-2)}
.tx+.tx{border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.tx-main{flex:1;min-width:0}
.tx-main b{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-main small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-amt{text-align:right;font-weight:800;font-size:14.5px;white-space:nowrap}
.tx-amt small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:19px;line-height:1;
  color:var(--ic,var(--text-2));background:color-mix(in srgb,var(--ic,var(--muted)) 16%,transparent)}
.ico.sm{width:32px;height:32px;border-radius:10px;font-size:16px}
.ico.sm svg.i{width:17px;height:17px}
.ico.lg{width:52px;height:52px;border-radius:15px;font-size:24px}
.ico.lg svg.i{width:26px;height:26px}
:root[data-mc-theme="cyber"] .ico{box-shadow:0 0 0 1px color-mix(in srgb,var(--ic,var(--muted)) 35%,transparent)}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}
.empty .ico{margin:0 auto 10px}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.empty .btn{margin-top:12px}

/* Barras de categoria */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center}
.bar-t{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:700;margin-bottom:5px}
.bar-t span:last-child{color:var(--muted);font-weight:700}
.bar-track{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--ic,var(--accent))}
.bar b{font-size:13.5px}

/* Chips / segmentos */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:13px;white-space:nowrap;color:var(--text-2)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
:root[data-mc-theme="cyber"] .chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:var(--glow)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:9px 6px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 0 var(--border),0 4px 12px rgba(0,0,0,.12)}
.seg button[aria-pressed="true"][data-tone="in"]{color:var(--in)}
.seg button[aria-pressed="true"][data-tone="out"]{color:var(--out)}
.seg button[aria-pressed="true"][data-tone="card"]{color:var(--card)}
.seg button[aria-pressed="true"][data-tone="invest"]{color:var(--invest)}
.search{position:relative}
.search svg.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search .input{padding-left:38px}

/* ===== Folha (modal) ===== */
.sheet-bg{position:fixed;inset:0;z-index:90;background:rgba(3,6,8,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease}
.sheet{width:min(560px,100%);max-height:min(92vh,880px);overflow:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:22px;padding:20px;box-shadow:var(--shadow);animation:pop .18s ease;overscroll-behavior:contain}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h3{font-size:18px;font-weight:800;margin-right:auto}
.sheet-actions{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:-20px;background:var(--surface);padding:12px 0 4px}
.sheet-actions .btn{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
@keyframes up{from{transform:translateY(100%)}}

.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--border);padding:6px 2px 8px;margin:14px 0 16px}
.amount:focus-within{border-color:var(--tone,var(--accent))}
.amount span{font-weight:800;color:var(--muted);font-size:20px}
.amount input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:38px;font-weight:800;font-family:var(--font-num);font-variant-numeric:tabular-nums;color:var(--tone,var(--text))}
.quick{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--r-md);padding:4px 4px 4px 12px}
.quick svg.i{color:var(--accent-ink);width:18px;height:18px}
.quick input{flex:1;min-width:0;border:0;outline:0;background:none;padding:8px 0}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-height:236px;overflow:auto;padding:2px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1px solid transparent;font-size:12px;font-weight:700;color:var(--text-2);text-align:center;line-height:1.2}
.cat:hover{background:var(--surface-2)}
.cat[aria-pressed="true"]{border-color:var(--ic,var(--accent));background:color-mix(in srgb,var(--ic,var(--accent)) 10%,transparent);color:var(--text)}
.cat span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat.add{border:1px dashed var(--border-strong);color:var(--muted)}
.hint{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:10px;padding:8px 10px;margin-top:8px}
.hint .link{margin-left:auto;padding:0}
.newcat{display:flex;gap:8px;align-items:center;margin-top:8px}
.newcat .input{flex:1}
.datechips{display:flex;gap:6px;margin-bottom:6px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.pickgrid button{height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:var(--text-2);border:1px solid transparent}
.pickgrid button:hover{background:var(--surface-2)}
.pickgrid button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pick-group{font-size:12.5px;font-weight:800;color:var(--muted);margin:14px 2px 8px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;background:var(--sw);border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset}

/* Contas fixas */
.bill{display:flex;align-items:center;gap:8px}
.bill+.bill{border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.bill .tx+.tx,.bill .tx{border-top:0}
.bill .btn.sm{flex:none}
.bill-act{display:flex;align-items:center;gap:6px;flex:none}
@media (max-width:560px){
  .bill{flex-wrap:wrap;gap:0}
  .bill>.tx{flex-basis:100%}
  .bill-act{width:100%;justify-content:flex-end;padding:0 6px 10px 58px;margin-top:-4px}
}
.st{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2)}
.st-paid{background:color-mix(in srgb,var(--in) 18%,transparent);color:var(--in)}
.st-late{background:color-mix(in srgb,var(--out) 18%,transparent);color:var(--out)}
.st-today{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.receipt .r-lines .r-proj{border-top:1.5px dashed var(--border-strong);padding-top:8px;margin-top:2px;font-weight:800;color:var(--text)}
.receipt .r-lines b.r-proj.c-in{color:var(--in)}.receipt .r-lines b.r-proj.c-out{color:var(--out)}
/* Metas */
.goal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-radius:12px}
.goal:hover{background:var(--surface-2)}
.goal+.goal{border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.goal-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.goal-main small{font-size:12.5px;font-weight:600}
.goal.compact{padding:8px 2px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);margin-bottom:6px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.check b{display:block;font-size:14px}.check small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.steps{margin:4px 0 6px 20px;display:flex;flex-direction:column;gap:10px;color:var(--text-2)}
input[type="month"].input{min-height:44px}

/* Ajustes */
.setlist{display:flex;flex-direction:column}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--border);width:100%;text-align:left}
.setrow:first-child{border-top:0}
.setrow .tx-main small{white-space:normal}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme-opt{border:1.5px solid var(--border);border-radius:14px;padding:10px;text-align:left;font-weight:800;font-size:13px;background:var(--surface-2)}
.theme-opt[aria-pressed="true"]{border-color:var(--accent)}
.theme-opt i{display:block;height:46px;border-radius:9px;margin-bottom:8px}
.t-dark i{background:linear-gradient(135deg,#0c1215 55%,#e9b949 55%)}
.t-light i{background:linear-gradient(135deg,#ffffff 55%,#d9a52c 55%);border:1px solid #dce4e1}
.t-cyber i{background:linear-gradient(135deg,#100b1f 55%,#ff2e97 55%,#ff2e97 78%,#33d6ff 78%)}

/* Cartões */
.cc{position:relative;border-radius:18px;padding:18px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  background:linear-gradient(135deg,var(--cc,#7c3aed),color-mix(in srgb,var(--cc,#7c3aed) 55%,#000))}
.cc::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.cc b{font-size:16px}.cc .num{font-size:28px;font-weight:800}
.cc small{opacity:.85;font-weight:700;font-size:12.5px}
.cc-row{display:flex;justify-content:space-between;align-items:end;gap:10px}
.progress{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--card)}

/* IA */
.chat{display:flex;flex-direction:column;gap:12px;min-height:240px;max-height:min(60vh,620px);overflow:auto;padding:4px}
.bubble{max-width:86%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.55;background:var(--surface-2);border:1px solid var(--border)}
.bubble.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-color:transparent}
.bubble p+p{margin-top:8px}
.bubble ul{margin:6px 0 0 18px}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.composer{display:flex;gap:8px;margin-top:12px}
.composer textarea{resize:none;min-height:46px;max-height:140px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;display:flex;align-items:center;gap:12px;background:var(--text);color:var(--bg);padding:11px 14px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 24px);animation:pop .18s ease}
.toast button{color:var(--bg);text-decoration:underline;font-weight:800}

canvas{max-width:100%}
.chartbox{position:relative;height:240px}

/* ===== Celular ===== */
@media (max-width:899px){
  .app{display:block}
  .side,.top{display:none}
  .mtop{display:flex;position:fixed;top:0;left:0;right:0;z-index:40;align-items:center;gap:8px;height:calc(var(--top-h) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 10px 0 14px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .mtop h1{font-size:17px;font-weight:800;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mtop .month b{min-width:96px;font-size:13px}
  .mtop .month .iconbtn{width:30px;height:30px}
  .main{padding:calc(var(--top-h) + 12px) 14px calc(var(--nav-h) + 28px)}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:0 6px env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
  .mnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
  .mnav button[aria-current="page"]{color:var(--text)}
  .mnav button[aria-current="page"] svg.i{color:var(--accent-ink)}
  .mnav .fab{align-self:center;justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow),var(--glow);margin-top:-18px}
  .mnav .fab svg.i{width:26px;height:26px;stroke-width:2.4}
  .sheet-bg{align-items:flex-end;padding:0}
  .sheet{width:100%;max-height:94vh;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
  .sheet::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--border-strong);margin:0 auto 12px}
  .panel{padding:16px}
  .stat b{font-size:18px}
  .themes{grid-template-columns:repeat(3,1fr)}
  .toast{bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:380px){.stats{grid-template-columns:1fr 1fr}.receipt{padding:18px 16px 28px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Impressão (PDF) ===== */
#print{display:none}
@media print{
  body{background:#fff!important;color:#111}
  body>*:not(#print){display:none!important}
  #print{display:block!important}
  @page{size:A4;margin:12mm}
}

    .replace(/\s+/g, ' ').trim();
  out.description = desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : '';

  const items = recItems(mk), pend = items.filter(i => !i.tx);
  const pay = pend.filter(i => i.r.type !== 'in'), recv = pend.filter(i => i.r.type === 'in');
  const hitsMonth = i => i.r.type !== 'card' || invoiceMonth(i.due, S.cardMap[i.r.card_id] || S.cards.find(c => !c.archived) || DEFAULT_CARD) === mk;
  return {
    items, pay, recv,
    toPay: r2(pay.filter(hitsMonth).reduce((s, i) => s + +i.r.amount, 0)),
    toReceive: r2(recv.reduce((s, i) => s + +i.r.amount, 0)),
    late: pend.filter(i => i.status === 'late'),
    paid: items.filter(i => i.tx)
  };
}
const recTxRow = (r, mk, date) => ({
  type: r.type, amount: r2(r.amount), date, description: r.name, category_id: r.category_id || null,
  card_id: r.type === 'card' ? (r.card_id || S.cards.find(c => !c.archived)?.id || null) : null,
  installments: 1, invest_kind: null, recurring_id: r.id, recurring_month: mk
});
// Lança sozinho as contas marcadas como automáticas (até 2 meses para trás). Não duplica.
async function autoRecurring() {
  if (!feat('bills') || !S.recs.some(r => r.auto && r.active)) return 0;
  const t = todayISO(), cur = t.slice(0, 7); let made = 0;
  for (let i = 2; i >= 0; i--) {
    for (const it of recItems(addMonths(cur, -i))) {
      if (!it.r.auto || it.tx || it.due > t) continue;
      try { S.txs.push(normTx(await api.addTx(recTxRow(it.r, it.mk, it.due)))); made++; }
      catch (e) { if (!/duplicate|23505|unique/i.test(String(e.message || '') + (e.code || ''))) console.warn('auto', e); }
    }
  }
  if (made) indexData();
  return made;
}
const waNumber = p => { const d = String(p || '').replace(/\D/g, ''); return d.length === 10 || d.length === 11 ? '55' + d : d; };
function chargeLink(it) {
  const pix = settings().pixKey;
  const msg = `Olá! Passando para lembrar do pagamento de ${money(it.r.amount)} (${it.r.name}), com vencimento em ${shortDate(it.due)}.${pix ? ` Pode ser no PIX: ${pix}.` : ''} Obrigado!`;
  return `https://wa.me/${waNumber(it.r.phone)}?text=${encodeURIComponent(msg)}`;
}

/* ===================== metas ===================== */
function monthsBetween(fromMk, toMk) { const [a, b] = fromMk.split('-').map(Number), [c, d] = toMk.split('-').map(Number); return (c - a) * 12 + (d - b); }
function goalProgress(g, mk) {
  let v = 0;
  if (g.kind === 'budget') v = (spendByCat(mk).find(x => x.cat.id === g.category_id) || { v: 0 }).v;
  else if (g.kind === 'income') v = S.txs.filter(t => t.type === 'in' && t.date.startsWith(mk) && (!g.category_id || t.category_id === g.category_id)).reduce((s, t) => s + t.amount, 0);
  else v = S.txs.filter(t => t.type === 'invest' && t.date >= g.start_date && (!g.category_id || t.category_id === g.category_id)).reduce((s, t) => s + (t.invest_kind === 'resgate' ? -t.amount : t.amount), 0);
  v = r2(v);
  const pct = g.amount > 0 ? v / g.amount : 0, out = { v, pct, left: r2(Math.max(0, g.amount - v)) };
  if (g.kind === 'save' && g.deadline) {
    const months = Math.max(1, monthsBetween(monthKey(new Date()), g.deadline.slice(0, 7)) + 1);
    out.months = months; out.perMonth = r2(out.left / months);
  }
  return out;
}
const goalTitle = g => g.kind === 'budget' ? (S.catMap[g.category_id]?.name || 'Categoria') : (g.name || (g.kind === 'income' ? (g.category_id ? 'Entradas de ' + (S.catMap[g.category_id]?.name || '') : 'Faturamento do mês') : 'Objetivo'));
const activeGoals = () => S.goals.filter(g => !g.archived);

/* ===================== análise local (sem custo) ===================== */
function insights(mk) {
  const T = totals(mk), P = totals(addMonths(mk, -1)), spend = spendByCat(mk), L = [];
  const gastos = T.out + T.card;
  if (!T.in && !gastos && !T.invest) return ['Ainda não há lançamentos neste mês. Toque em + para registrar o primeiro.'];
  if (T.in > 0) {
    const taxa = Math.round((T.saldo / T.in) * 100);
    L.push(T.saldo >= 0 ? `Sobraram ${money(T.saldo)} de ${money(T.in)} que entraram (${taxa}% guardado).` : `Saiu ${money(-T.saldo)} a mais do que entrou. Vale olhar as maiores saídas abaixo.`);
  } else if (gastos > 0) L.push(`Saíram ${money(gastos)} e ainda não há entradas registradas neste mês.`);
  if (spend[0] && gastos > 0) L.push(`Maior gasto: ${spend[0].cat.name}, com ${money(spend[0].v)} (${Math.round(spend[0].v / gastos * 100)}% das saídas).`);
  const pg = P.out + P.card;
  if (pg > 0 && gastos > 0) {
    const d = Math.round((gastos - pg) / pg * 100);
    if (Math.abs(d) >= 5) L.push(d > 0 ? `Os gastos subiram ${d}% em relação a ${monthShort(addMonths(mk, -1))}.` : `Os gastos caíram ${-d}% em relação a ${monthShort(addMonths(mk, -1))}. Boa!`);
  }
  if (T.in > 0 && T.card / T.in > 0.3) L.push(`A fatura do cartão consome ${Math.round(T.card / T.in * 100)}% do que entrou. Acima de 30% costuma apertar o caixa.`);
  const next = cardItemsFor(addMonths(mk, 1)).reduce((s, p) => s + p.amount, 0);
  if (next > 0) L.push(`Já há ${money(next)} em parcelas para a fatura de ${monthShort(addMonths(mk, 1))}.`);
  if (T.invest > 0) L.push(`Você investiu ${money(T.invest)} neste mês.`);
  const RS = recSummary(mk);
  if (feat('bills')) {
  if (RS.late.length) L.push(`${RS.late.length} conta${RS.late.length > 1 ? 's' : ''} fixa${RS.late.length > 1 ? 's' : ''} em atraso: ${RS.late.slice(0, 3).map(i => i.r.name).join(', ')}.`);
  else if (RS.toPay > 0) L.push(`Ainda faltam ${money(RS.toPay)} em contas fixas para pagar neste mês.`);
  if (RS.toReceive > 0) L.push(`Faltam receber ${money(RS.toReceive)} de ${RS.recv.length} conta${RS.recv.length > 1 ? 's' : ''} fixa${RS.recv.length > 1 ? 's' : ''}.`);
  }
  if (feat('goals')) for (const g of activeGoals().filter(g => g.kind === 'budget')) { const p = goalProgress(g, mk); if (p.pct >= 1) L.push(`Limite de ${goalTitle(g)} estourado em ${money(p.v - g.amount)}.`); }
  return L;
}

  async deleteGoal(id) { this._del('goals', id); },
  async upsertCats(rows) { for (const r of rows) if (!this.db.cats.some(c => c.kind === r.kind && c.legacy_key === r.legacy_key)) this._ins('cats', { archived: false, sort: 50, ...r }); return JSON.parse(JSON.stringify(this.db.cats)); },
  async upsertCard(row) { if (!this.db.cards.some(c => c.legacy_key === row.legacy_key)) this._ins('cards', { archived: false, ...row }); return JSON.parse(JSON.stringify(this.db.cards)); },
  async insertTxs(rows, onProgress) {
    const seen = new Set(this.db.txs.map(t => t.legacy_ts).filter(Boolean));
    for (const r of rows) if (!r.legacy_ts || !seen.has(r.legacy_ts)) { this.db.txs.push({ id: uid(), created_at: new Date().toISOString(), ...r }); seen.add(r.legacy_ts); }
    this.save(); onProgress && onProgress(rows.length, rows.length);
  },
  async ai() { const e = new Error('demo'); e.status = 0; throw e; }
};

function invoiceStatus(card, mk) {
  const [y, m] = mk.split('-').map(Number);
  const dueDay = Math.min(card.due_day, new Date(y, m, 0).getDate());
  const due = `${mk}-${pad(dueDay)}`;
  let cm = mk; if (card.due_day <= card.closing_day) cm = addMonths(mk, -1);
  const [cy, cmo] = cm.split('-').map(Number);
  const closing = `${cm}-${pad(Math.min(card.closing_day, new Date(cy, cmo, 0).getDate()))}`;
  const t = todayISO();
  if (t > due) return { label: `Venceu em ${shortDate(due)}`, tone: 'c-muted' };
  if (t > closing) return { label: `Fechada, vence ${shortDate(due)}`, tone: 'c-out' };
  return { label: `Aberta, fecha ${shortDate(closing)} e vence ${shortDate(due)}`, tone: 'c-in' };
}

  return `<div class="stack">${cards.map(card => {
    const items = cardItemsFor(S.month, card.id), total = r2(items.reduce((s, p) => s + p.amount, 0));

    const future = r2(S.txs.filter(t => t.type === 'card' && cardOf(t).id === card.id).flatMap(installmentsOf).filter(p => p.month > S.month).reduce((s, p) => s + p.amount, 0));
    return `<div class="grid g-2">

        <div class="cc-row"><b>${esc(card.name)}</b><button class="iconbtn" style="color:#fff" data-act="editCard" data-id="${esc(card.id)}" aria-label="Editar cartão ${esc(card.name)}">${ico('pencil')}</button></div>
        <div><small>Fatura de ${esc(monthLabel(S.month))}</small><div class="num">${money(total)}</div></div>
        <div class="cc-row"><small>${esc(st.label)}</small><small>Fecha dia ${card.closing_day}, vence dia ${card.due_day}</small></div>
      </div>
      ${lim ? `<div class="panel"><h2>Limite</h2><div class="row"><span class="c-muted">Comprometido</span><b class="num" style="text-align:right">${money(total + future)} de ${money(lim)}</b></div><div class="progress"><i style="width:${Math.min(100, Math.round((total + future) / lim * 100))}%"></i></div></div>` : ''}

/* ===================== folhas (modais) ===================== */
const SHEETS = [];
function openSheet(html, labelId) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"${labelId ? ` aria-labelledby="${labelId}"` : ''}>${html}</div>`;
  bg.addEventListener('mousedown', e => { if (e.target === bg) closeSheet(); });
  $('#sheet-root').appendChild(bg);
  SHEETS.push({ bg, prev: document.activeElement });
  document.body.style.overflow = 'hidden';
  setTimeout(() => { const f = bg.querySelector('[data-autofocus]') || bg.querySelector('input,select,textarea,button'); f && f.focus({ preventScroll: true }); }, 40);
  return bg.firstElementChild;
}
function closeSheet() {
  const top = SHEETS.pop(); if (!top) return;
  top.bg.remove();
  if (!SHEETS.length) document.body.style.overflow = '';
  if (top.prev && document.contains(top.prev)) top.prev.focus({ preventScroll: true });
}
const sheetHead = (id, title) => `<div class="sheet-h"><h3 id="${id}">${esc(title)}</h3><button class="iconbtn" data-act="closeSheet" aria-label="Fechar">${ico('x')}</button></div>`;
let TOAST_T, TOAST_FN = null;
function toast(msg, action) {
  const root = $('#toast-root');
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${action ? `<button data-act="toastAction">${esc(action.label)}</button>` : ''}</div>`;
  TOAST_FN = action ? action.fn : null;
  clearTimeout(TOAST_T); TOAST_T = setTimeout(() => { root.innerHTML = ''; TOAST_FN = null; }, action ? 8000 : 2800);
}
function errMsg(e) {
  const m = String(e?.message || e || '');
  if (/fetch|network|Failed to load|NetworkError/i.test(m)) return 'Sem conexão. Confira a internet e tente de novo.';
  if (/row-level security|permission denied|42501/i.test(m)) return 'Seu plano está vencido: dá para ver e exportar, mas não salvar. Renove em Ajustes.';
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link que enviamos e tente de novo.';
  if (/already registered|already been registered/i.test(m)) return 'Este e-mail já tem conta. Use "Entrar".';
  if (/Password should be|weak/i.test(m)) return 'Senha fraca: use pelo menos 6 caracteres.';
  if (/rate limit|too many/i.test(m)) return 'Muitas tentativas. Aguarde um minuto.';
  return m.length < 140 && m ? m : 'Algo deu errado. Tente de novo.';
}

// Escolhe categoria pela descrição (ex.: "drogasil" → Farmácia)
function matchCategory(text, kind) {
  const icon = suggestIcon(text, kind);
  if (!iconIsSpecific(icon)) return null;
  const list = catsOfKind(kind), n = norm(text), fam = familyOf(icon, kind);
  return list.find(c => c.icon === icon) || (fam && list.find(c => c.legacy_key === fam)) || list.find(c => n.includes(norm(c.name))) || null;
}
const txHint = debounce(() => {
  const el = $('#tx-hint'); if (!el || !TX) return;
  const desc = $('#tx-desc').value, kind = catKindOf(TX.type);
  const c = desc.length >= 3 ? matchCategory(desc, kind) : null;
  if (!c || c.id === TX.category_id) { el.innerHTML = ''; return; }
  if (!TX.touchedCat) { TX.category_id = c.id; updTxCats(); el.innerHTML = `<div class="hint">${ico('sparkles')}<span>Categoria escolhida pela descrição: <b>${esc(c.name)}</b></span></div>`; return; }
  el.innerHTML = `<div class="hint">${ico('sparkles')}<span>Parece <b>${esc(c.name)}</b></span><button class="link" data-act="txCat" data-id="${esc(c.id)}">Usar</button></div>`;
}, 250);
function txQuickFill() {
  const q = $('#tx-quick'); if (!q || !q.value.trim()) return;
  const r = parseQuick(q.value, todayISO());
  if (!r) { toast('Não achei o valor. Ex.: "mercado 52,90"'); return; }
  TX.type = r.type === 'card' && !S.cards.some(c => !c.archived) ? 'out' : r.type;
  if (r.type === 'invest') TX.invest_kind = r.investKind || 'aporte';
  TX.installments = r.type === 'card' ? r.installments : 1;
  $('#tx-amount').value = r.amount.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  $('#tx-date').value = r.date;
  $('#tx-desc').value = r.description;
  const c = r.description ? matchCategory(r.description, catKindOf(TX.type)) : null;
  TX.category_id = c ? c.id : null; TX.touchedCat = false;
  updTxAll();
  if (r.type === 'card' && TX.type === 'out') toast('Cadastre um cartão para lançar no crédito.');
  q.value = '';
  $('#tx-save').focus();
}

async function saveTx() {
  const amount = parseAmountBR($('#tx-amount').value);
  const date = $('#tx-date').value;
  if (!amount) { toast('Informe o valor.'); $('#tx-amount').focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('Informe a data.'); return; }
  if (TX.type === 'card' && !S.cardMap[TX.card_id]) { toast('Escolha o cartão.'); return; }
  const row = {
    type: TX.type, amount, date, description: $('#tx-desc').value.trim().slice(0, 140),
    category_id: TX.category_id || null,
    card_id: TX.type === 'card' ? TX.card_id : null,
    installments: TX.type === 'card' ? (+$('#tx-inst')?.value || 1) : 1,
    invest_kind: TX.type === 'invest' ? (TX.invest_kind || 'aporte') : null
  };
  if (!TX.id && TX.recurring_id) { row.recurring_id = TX.recurring_id; row.recurring_month = TX.recurring_month; }
  const btn = $('#tx-save'); btn.disabled = true;
  try {
    if (TX.id) {
      const saved = normTx(await api.updateTx(TX.id, row));
      S.txs = S.txs.map(t => t.id === TX.id ? saved : t);
    } else {
      S.txs.push(normTx(await api.addTx(row)));
      store.set('mc_last_type', row.type === 'card' ? 'out' : row.type);
    }
    indexData();
    const wasEdit = !!TX.id;
    closeSheet(); TX = null;
    if (!date.startsWith(S.month) && !wasEdit) S.month = date.slice(0, 7);
    render(); toast(budgetAlert(row) || (wasEdit ? 'Lançamento atualizado' : row.recurring_id ? 'Conta marcada como ' + (row.type === 'in' ? 'recebida' : 'paga') : 'Lançamento salvo'));
  } catch (e) { btn.disabled = false; toast(/23505|duplicate|unique/i.test(String(e.message || '') + (e.code || '')) ? 'Essa conta já foi lançada neste mês.' : errMsg(e)); }
}
// Aviso quando um gasto encosta no limite da categoria
function budgetAlert(row) {
  if (!feat('goals') || !row || (row.type !== 'out' && row.type !== 'card') || !row.category_id) return '';
  const g = activeGoals().find(x => x.kind === 'budget' && x.category_id === row.category_id); if (!g) return '';
  const mk = row.type === 'card' && settings().cardMode !== 'purchase' ? invoiceMonth(row.date, S.cardMap[row.card_id] || DEFAULT_CARD) : row.date.slice(0, 7);
  const p = goalProgress(g, mk), pct = Math.round(p.pct * 100);
  if (pct >= 100) return `Salvo. Limite de ${goalTitle(g)} estourado: ${pct}%`;
  if (pct >= 80) return `Salvo. Você já usou ${pct}% do limite de ${goalTitle(g)}`;
  return '';
}
async function deleteTx() {
  const t = S.txs.find(x => x.id === TX.id); if (!t) return;
  try {
    await api.deleteTx(t.id);
    S.txs = S.txs.filter(x => x.id !== t.id); indexData(); closeSheet(); TX = null; render();
    toast('Lançamento excluído', {
      label: 'Desfazer', fn: async () => {
        const { id, created_at, updated_at, user_id, ...row } = t;
        try { S.txs.push(normTx(await api.addTx(row))); indexData(); render(); toast('Lançamento restaurado'); } catch (e) { toast(errMsg(e)); }
      }
    });
  } catch (e) { toast(errMsg(e)); }
}

let PICK = null;
function openIconPicker(current, color, onPick) {
  PICK = { tab: current && !current.startsWith('i:') ? 'emoji' : 'icon', q: '', current, color, onPick };
  openSheet(`${sheetHead('pick-title', 'Escolha o ícone')}
    <div class="seg" id="pick-tabs" role="group" aria-label="Tipo de ícone"></div>
    <div class="search" style="margin:12px 0 4px"><label class="sr" for="pick-q">Buscar ícone</label>${ico('search')}<input class="input" id="pick-q" placeholder="Buscar: farmácia, carro, comida…" autocomplete="off" data-input="pickq"></div>
    <div id="pick-body"></div>`, 'pick-title');
  updPick();
}
function iconSearch(q) {
  const n = norm(q); if (!n) return null;
  const hits = new Set();
  for (const [rx, icon] of ICON_RX) if (rx.test(n)) hits.add(icon);
  for (const [w, icon] of ICON_RULES) if (w.split('|').some(x => x.replace(/\\b|\?|\\/g, '').startsWith(n))) hits.add(icon);
  for (const k of Object.keys(ICONS)) if (k.includes(n)) hits.add(k);
  return [...hits].filter(k => Object.values(ICON_GROUPS).some(g => g.includes(k)));
}
function updPick() {
  $('#pick-tabs').innerHTML = `<button data-act="pickTab" data-t="icon" aria-pressed="${PICK.tab === 'icon'}">Ícones</button><button data-act="pickTab" data-t="emoji" aria-pressed="${PICK.tab === 'emoji'}">Emojis</button>`;
  $('#pick-q').closest('.search').hidden = PICK.tab !== 'icon';
  const btn = (val, inner, label) => `<button data-act="pickIt" data-v="${esc(val)}" aria-pressed="${PICK.current === val}" aria-label="${esc(label)}"${PICK.color && val.startsWith('i:') ? ` style="color:${safeColor(PICK.color) || 'inherit'}"` : ''}>${inner}</button>`;
  let html = '';
  if (PICK.tab === 'icon') {
    const found = iconSearch(PICK.q);
    if (found) html = found.length ? `<div class="pickgrid">${found.map(k => btn('i:' + k, ico(k), k)).join('')}</div>` : '<p class="c-muted" style="padding:14px 2px">Nada com esse nome. Tente outra palavra ou use um emoji.</p>';
    else html = Object.entries(ICON_GROUPS).map(([g, list]) => `<div class="pick-group">${esc(g)}</div><div class="pickgrid">${list.map(k => btn('i:' + k, ico(k), k)).join('')}</div>`).join('');
  } else {
    html = `<div class="row" style="margin:12px 0"><label class="sr" for="pick-emoji">Emoji personalizado</label><input class="input" id="pick-emoji" placeholder="Ou cole qualquer emoji aqui" maxlength="16" autocomplete="off"><button class="btn sm" data-act="pickCustom" style="flex:0 0 auto">Usar</button></div><div class="pickgrid">${EMOJI_SET.map(e => btn(e, e, e)).join('')}</div>`;
  }
  $('#pick-body').innerHTML = html;
}

    if (found) { catMap[c.id] = found.id; continue; }

    const found = S.recs.find(x => x.type === r.type && key(x.name) === key(r.name) && +x.day === day(r.day, 1));

      category_id: cid && S.catMap[cid]?.kind === (r.type === 'in' ? 'in' : 'out') ? cid : null,

    rows.push({
      type: t.type, amount: r2(t.amount), date: String(t.date).slice(0, 10), description: String(t.description || '').slice(0, 140),
      category_id: cid && S.catMap[cid]?.kind === catKindOf(t.type) ? cid : null,
      card_id: t.type === 'card' ? (cardMap[t.card_id] || anyCard()) : null,
      installments: t.type === 'card' ? Math.min(48, Math.max(1, parseInt(t.installments, 10) || 1)) : 1,
      invest_kind: t.type === 'invest' ? (t.invest_kind === 'resgate' ? 'resgate' : 'aporte') : null,
      legacy_ts: k, legacy_id: t.legacy_id ? String(t.legacy_id).slice(0, 100) : null,
      recurring_id: rid, recurring_month: rid ? rmonth : null
    });
  }
  if (rows.length) await api.insertTxs(rows);
  useData(await api.loadAll());
  const want = new Set(rows.map(r => r.legacy_ts)), got = S.txs.filter(t => want.has(Number(t.legacy_ts)));
  const sum = (list, type) => r2(list.filter(t => t.type === type).reduce((s, t) => s + (+t.amount), 0));
  return { total: rows.length, already, skipped, ok: got.length === rows.length && ['in', 'out', 'card', 'invest'].every(k => sum(rows, k) === sum(got, k)) };
}

async function onAuthSubmit(e) {
  e.preventDefault();
  const email = $('#auth-email').value.trim(), pass = $('#auth-pass').value, pass2 = $('#auth-pass2').value;
  const btn = $('#auth-submit'); btn.disabled = true;
  try {
    if (AUTH_MODE === 'recovery') {

      if (pass !== pass2) throw new Error('As senhas não são iguais.');
      await api.newPassword(pass); history.replaceState(null, '', location.pathname + location.search); AUTH_MODE = 'login';
      authMsg('Senha alterada. Entrando…', true); S.user = (await api.session())?.user; await startApp();
    } else if (AUTH_MODE === 'signup') {
      if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error('Digite um e-mail válido.');
      if (pass.length < 6) throw new Error('Password should be at least 6');
      if (pass !== pass2) throw new Error('As senhas não são iguais.');
      const needsConfirm = await api.signUp(email, pass);
      if (needsConfirm) authMsg('Conta criada! Abra o link que enviamos para ' + email + ' e depois entre aqui.', true);

  cdColor: el => { CD.color = el.dataset.c; $$('#cd-sw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === CD.color)); },

  recEdit: el => openRecEditor(el.dataset.id, el.dataset.type),

const INPUT = {
  search: debounce(el => { S.q = el.value; const pos = el.selectionStart; render(); const n = $('#q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch { } } }, 220),

function closeAllSheets() { while (SHEETS.length) closeSheet(); }
function trapFocus(e) {
  const box = SHEETS.at(-1).bg.querySelector('.sheet');
  const f = [...box.querySelectorAll('button,input,select,textarea,a[href]')].filter(x => !x.disabled && x.offsetParent !== null);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
  else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
}

/* ===================== início ===================== */
const useData = d => { S.profile = d.profile; S.cats = d.cats || []; S.cards = d.cards || []; S.txs = (d.txs || []).map(normTx); S.recs = d.recs || []; S.goals = d.goals || []; indexData(); };
function showApp() { $('#boot').hidden = true; $('#auth').hidden = true; $('#blocked').hidden = true; $('#app').hidden = false; }
// Abre na hora com a última cópia guardada (e atualiza assim que o servidor responder)
function instantStart() {
  try {
    const snap = store.get('mc_snap', null), ref = new URL(CFG.supabaseUrl).hostname.split('.')[0];
    const tok = store.get(`sb-${ref}-auth-token`, null), uidTok = tok && tok.user && tok.user.id;
    if (!snap || !uidTok || snap.uid !== uidTok || AUTH_MODE === 'recovery') return;
    S.user = { id: uidTok, email: tok.user.email || '' }; S.fromCache = true; useData(snap.d);
    if (S.profile?.settings?.theme) setTheme(S.profile.settings.theme, false);
    if (isBlocked()) return;
    showApp(); const p = store.get('mc_page', 'home'); S.page = PAGES[p] && pageOn(p) ? p : 'home'; render();
  } catch (e) { /* sem cópia: segue o caminho normal */ }
}
async function startApp() {
  try {
    const d = await api.loadAll(); useData(d); S.offline = false;
    if (S.mode === 'live' && S.user) store.set('mc_snap', { uid: S.user.id, at: Date.now(), d });
  } catch (e) {
    const snap = S.mode === 'live' && store.get('mc_snap', null);
    if (snap && S.user && snap.uid === S.user.id) { useData(snap.d); S.offline = true; toast(`Sem internet: mostrando seus dados de ${new Date(snap.at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}. Para lançar, conecte-se.`); }
    else toast(errMsg(e));
  }
  if (S.profile?.settings?.theme) setTheme(S.profile.settings.theme, false);
  if (S.mode === 'live' && isBlocked()) { showBlocked(); return; }
  showApp();
  const p = store.get('mc_page', 'home'); S.page = PAGES[p] && pageOn(p) ? p : 'home';
  render();
  if (!isBlocked() && !S.offline) { const made = await autoRecurring().catch(() => 0); if (made) { render(); toast(`${made} conta${made > 1 ? 's' : ''} fixa${made > 1 ? 's' : ''} lançada${made > 1 ? 's' : ''} automaticamente`); } }
  if (/[?&]novo=1\b/.test(location.search)) { history.replaceState(null, '', location.pathname); setTimeout(() => openTx(), 300); }
  else if (S.mode === 'live' && !S.txs.some(t => t.legacy_ts) && hasLegacyTraces() && !store.get('mc_mig_dismiss', false)) setTimeout(() => openMigration(true), 700);
}
async function boot() {
  setTheme(store.get('mc_theme_v2', null) || ({ matrix: 'cyber' }[store.get('mc_theme', '')] || store.get('mc_theme', null)) || 'dark', false);
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); } });
  document.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.input;
    if (k && INPUT[k]) return INPUT[k](e.target, e);
    if (e.target.id === 'tx-desc') txHint();
    if (e.target.id === 'tx-amount') updInstInfo();
    if (e.target.id === 'tx-date') { updDateChips(); updInstInfo(); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'tx-inst' && TX) { TX.installments = +e.target.value; updInstInfo(); }
    if (e.target.id === 'file-import') importFile(e.target.files[0]);
    if (e.target.id === 'tx-amount') { const v = parseAmountBR(e.target.value); if (v) e.target.value = v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && SHEETS.length) { e.preventDefault(); closeSheet(); return; }
    if (e.key === 'Tab' && SHEETS.length) { trapFocus(e); return; }
    if (e.key === 'Enter' && e.target.id === 'tx-quick') { e.preventDefault(); txQuickFill(); return; }
    if (e.key === 'Enter' && e.target.id === 'ai-in' && !e.shiftKey) { e.preventDefault(); ACT.aiSend(); return; }
    if ((e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !SHEETS.length && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '') && !$('#app').hidden) { e.preventDefault(); openTx(); }
  });
  $('#auth-form').addEventListener('submit', onAuthSubmit);
  const live = CFG.supabaseUrl && CFG.supabaseKey && !/[?&]demo=1\b/.test(location.search);
  setTimeout(registerSW, 2000);
  if (live) {
    S.mode = 'live'; api = Live;
    if (/type=recovery/.test(location.hash)) AUTH_MODE = 'recovery';
    instantStart();
    try { await Live.init(); } catch (e) { $('#boot').textContent = 'Não foi possível carregar. Confira a internet e recarregue a página.'; return; }
    Live.onAuth((ev, session) => setTimeout(async () => {
      if (ev === 'PASSWORD_RECOVERY') { S.user = session?.user || null; showAuth('recovery'); return; }
      if (ev === 'SIGNED_OUT') { S.user = null; showAuth('login'); return; }
      if (session && (!S.user || S.user.id !== session.user.id || S.fromCache) && AUTH_MODE !== 'recovery') { S.user = session.user; S.fromCache = false; await startApp(); return; }
      if (ev === 'INITIAL_SESSION' && !session) showAuth('login');
    }, 0));
  } else {
    S.mode = 'demo'; api = Demo; await Demo.init();
    S.user = { id: 'demo', email: 'demo@meucaixa.app' };
    await startApp();
  }
}
window.addEventListener('DOMContentLoaded', boot);

if (window.__MC_TEST__) window.__mc = { feat, recItems, recSummary, goalProgress, autoRecurring, chargeLink, budgetAlert, payRec, S, api: () => api, Demo, totals, invoiceMonth, installmentsOf, splitInstallments, cardItemsFor, spendByCat, insights, buildLegacyPlan, applyLegacyPlan, buildBackup, restoreV2, parseQuick, suggestIcon, render, go, openTx, saveTx, setTheme, esc, startApp, ACT, localAnswer, matchCategory };
})();
